name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: pwsh
        run: |
          # Dùng npm ci khi đã có lockfile; chưa có thì npm install (xem docs/ROADMAP.md).
          if (Test-Path package-lock.json) { npm ci } else { npm install }
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/desktop/dist
          if-no-files-found: error

  rust:
    needs: frontend
    runs-on: windows-2025
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/desktop/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Check
        run: cargo check --all-targets
      - name: Clippy
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.txt
          status=${PIPESTATUS[0]}
          # Ghi lỗi đầu tiên thành annotation để đọc được từ API/Giao diện.
          hits=$(grep -Ei 'error|warning' clippy.txt | head -n 9)
          if [ -z "$hits" ]; then hits=$(tail -n 9 clippy.txt); fi
          printf '%s\n' "$hits" | while IFS= read -r line; do
            echo "::error::$line"
          done
          {
            echo '### Clippy'
            echo '```'
            tail -c 40000 clippy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Tests
        shell: bash
        run: |
          set +e
          cargo test --all-targets 2>&1 | tee test.txt
          status=${PIPESTATUS[0]}
          # Xuất tên test hỏng và thông điệp panic thành annotation để đọc từ API.
          hits=$(grep -E '^test .* FAILED|^---- |panicked at|^assertion' test.txt | head -n 20)
          if [ -z "$hits" ]; then hits=$(grep -E 'error' test.txt | head -n 20); fi
          printf '%s\n' "$hits" | while IFS= read -r line; do
            echo "::error::$line"
          done
          {
            echo '### Tests'
            echo '```'
            tail -c 40000 test.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      # Định dạng chạy cuối: trước đây nó đứng đầu nên chỉ một lỗi xuống dòng
      # cũng làm Clippy/Check/Tests bị bỏ qua, không thấy lỗi biên dịch thật.
      - name: Format
        shell: bash
        run: |
          set +e
          cargo fmt --all -- --check 2>&1 | tee fmt.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### Định dạng — cần chạy `cargo fmt --all`'
              echo '```diff'
              head -c 20000 fmt.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E '^Diff in' fmt.txt | head -n 20 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"
