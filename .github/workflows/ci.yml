name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: pwsh
        run: |
          # Dùng npm ci khi đã có lockfile; chưa có thì npm install (xem docs/ROADMAP.md).
          if (Test-Path package-lock.json) { npm ci } else { npm install }
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/desktop/dist
          if-no-files-found: error

  rust:
    needs: frontend
    runs-on: windows-2025
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/desktop/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.txt
          status=${PIPESTATUS[0]}
          # Ghi tối đa 9 lỗi đầu tiên thành annotation để đọc được từ API/Giao diện.
          grep -E '^(error|warning)(\[|:)' clippy.txt | head -n 9 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit "$status"
      - name: Check
        run: cargo check --all-targets
      - name: Tests
        run: cargo test --all-targets
