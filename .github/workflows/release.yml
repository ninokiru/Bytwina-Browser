name: Release

# Chỉ chạy khi bạn tự đẩy tag phiên bản (ví dụ v0.0.2).
# Release được tạo và PHÁT HÀNH NGAY; step "Verify assets" in danh sách tệp đã tải lên.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install frontend deps
        working-directory: apps/desktop
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }
      - name: Build installer (NSIS)
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis --target x86_64-pc-windows-msvc
      - name: Checksums
        shell: pwsh
        run: |
          $f = Get-ChildItem -Recurse -Filter *-setup.exe apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis | Select-Object -First 1
          if (-not $f) { throw "NSIS installer not found" }
          # gh thay dấu cách bằng dấu chấm khi đặt tên asset. Đặt tên lại ngay ở đây
          # để dòng hash trỏ đúng file người dùng tải về, không phá `sha256sum -c`.
          $name = $f.Name -replace ' ', '.'
          $asset = Join-Path $f.DirectoryName $name
          if ($asset -ne $f.FullName) { Copy-Item $f.FullName $asset -Force }
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii SHA256SUMS.txt
          echo "INSTALLER=$asset" >> $env:GITHUB_ENV
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --title "Bytwina Browser ${{ github.ref_name }}" --generate-notes --latest "$env:INSTALLER" SHA256SUMS.txt
      - name: Verify assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name'
