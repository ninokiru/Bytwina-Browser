name: Release

# Hai cách chạy:
# 1. Đẩy tag phiên bản (ví dụ v0.0.4) — giữ nguyên cách cũ.
# 2. Bấm "Run workflow" trên tab Actions, nhập phiên bản (ví dụ v0.0.4).
# Release chỉ được tạo ở dạng draft sau khi CI xanh trên đúng commit.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Phiên bản phát hành, dạng vX.Y.Z (ví dụ v0.0.4). Tag sẽ được tạo tại nhánh mặc định."
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT -eq "workflow_dispatch") { $tag = $env:INPUT_VERSION } else { $tag = $env:REF_NAME }
          $tag = $tag.Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Phiên bản không hợp lệ: '$tag' (cần dạng vX.Y.Z)" }
          echo "TAG=$tag" >> $env:GITHUB_ENV
          echo "Phát hành $tag"
      - name: Require green CI for this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $deadline = (Get-Date).AddMinutes(15)
          do {
            $runs = gh run list --workflow ci.yml --commit $env:GITHUB_SHA --json status,conclusion,databaseId --limit 10 | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Không truy vấn được CI cho commit $env:GITHUB_SHA" }
            $run = $runs | Select-Object -First 1
            if ($run -and $run.status -eq "completed") {
              if ($run.conclusion -ne "success") { throw "CI run $($run.databaseId) kết thúc: $($run.conclusion)" }
              Write-Output "CI xanh trên commit $env:GITHUB_SHA (run $($run.databaseId))"
              break
            }
            if ((Get-Date) -ge $deadline) { throw "Không có CI xanh hoàn tất cho commit $env:GITHUB_SHA trong 15 phút" }
            Start-Sleep -Seconds 15
          } while ($true)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Set release version
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart("v")
          $packagePath = "apps/desktop/package.json"
          $package = Get-Content $packagePath -Raw | ConvertFrom-Json
          $package.version = $version
          $package | ConvertTo-Json -Depth 20 | Set-Content $packagePath -Encoding utf8

          $packageLockPath = "apps/desktop/package-lock.json"
          $packageLock = Get-Content $packageLockPath -Raw | ConvertFrom-Json -AsHashtable
          $packageLock.version = $version
          $rootPackage = $packageLock.packages[""]
          if ($null -ne $rootPackage) { $rootPackage.version = $version }
          $packageLock | ConvertTo-Json -Depth 100 | Set-Content $packageLockPath -Encoding utf8

          $tauriPath = "apps/desktop/src-tauri/tauri.conf.json"
          $tauri = Get-Content $tauriPath -Raw | ConvertFrom-Json
          $tauri.version = $version
          $tauri | ConvertTo-Json -Depth 20 | Set-Content $tauriPath -Encoding utf8

          $cargoPath = "apps/desktop/src-tauri/Cargo.toml"
          $cargo = Get-Content $cargoPath -Raw
          $cargoReplacement = '${1}' + $version + '${2}'
          $cargo = [regex]::Replace($cargo, '(?m)^(version\s*=\s*")[^"]+("\s*)$', $cargoReplacement, 1)
          Set-Content $cargoPath $cargo -Encoding utf8

          $lockPath = "apps/desktop/src-tauri/Cargo.lock"
          $lock = Get-Content $lockPath -Raw
          $lockReplacement = '${1}' + $version
          $lock = [regex]::Replace($lock, '(?s)(\[\[package\]\]\r?\nname = "bytwina-browser"\r?\nversion = ")[^"]+', $lockReplacement, 1)
          Set-Content $lockPath $lock -Encoding utf8
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install frontend deps
        working-directory: apps/desktop
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
      # M14: bản cài tự cập nhật được khi có khoá ký. Khoá công khai là dữ liệu
      # không bí mật, nhưng chèn từ secret để repo không bị khoá cứng vào một
      # máy: đổi máy ký chỉ cần đổi secret. Không có secret thì build thường,
      # tauri.conf.json giữ pubkey rỗng và app bỏ qua bước tự cập nhật.
      - name: Signing key
        shell: pwsh
        env:
          PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          PRIVKEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PRIVKEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:PUBKEY -and $env:PRIVKEY) {
            $conf = "apps/desktop/src-tauri/tauri.conf.json"
            $json = Get-Content $conf -Raw | ConvertFrom-Json
            $json.plugins.updater.pubkey = $env:PUBKEY
            # Chỉ khi có khoá ký mới sinh .sig; tauri-cli coi có pubkey mà thiếu privkey là lỗi.
            $json.bundle.createUpdaterArtifacts = $true
            $json | ConvertTo-Json -Depth 20 | Set-Content $conf -Encoding utf8
            Add-Content $env:GITHUB_ENV "TAURI_SIGNING_PRIVATE_KEY=$env:PRIVKEY"
            Add-Content $env:GITHUB_ENV "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$env:PRIVKEY_PASSWORD"
            echo "UPDATER_SIGNED=1" >> $env:GITHUB_ENV
          } else {
            # Không có khoá: tắt sinh artifact cập nhật (xem CI run 44739064539, lỗi "public key found but no private key").
            echo "::warning::Thiếu TAURI_UPDATER_PUBKEY/TAURI_SIGNING_PRIVATE_KEY: bản này sẽ không ký, người dùng không tự cập nhật được."
            echo "UPDATER_SIGNED=0" >> $env:GITHUB_ENV
          }
      - name: Build installer (NSIS)
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis --target x86_64-pc-windows-msvc
      - name: Checksums and updater manifest
        shell: pwsh
        run: |
          $root = "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $f = Get-ChildItem -Recurse -Filter *-setup.exe $root | Select-Object -First 1
          if (-not $f) { throw "NSIS installer not found" }
          # gh thay dấu cách bằng dấu chấm khi đặt tên asset. Đặt tên lại ngay ở đây
          # để dòng hash trỏ đúng file người dùng tải về, không phá `sha256sum -c`.
          $name = $f.Name -replace ' ', '.'
          $asset = Join-Path $f.DirectoryName $name
          if ($asset -ne $f.FullName) { Copy-Item $f.FullName $asset -Force }
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii SHA256SUMS.txt
          echo "INSTALLER=$asset" >> $env:GITHUB_ENV
          echo "ASSET_NAME=$name" >> $env:GITHUB_ENV

          # latest.json = chỗ tauri-plugin-updater đọc. Bắt buộc có chữ ký
          # minisign (tệp .sig do tauri build sinh ra khi có khoá).
          if ($env:UPDATER_SIGNED -eq "1") {
            $sigFile = "$($f.FullName).sig"
            if (-not (Test-Path $sigFile)) { throw "Thiếu ${sigFile}: bản build không sinh chữ ký cập nhật." }
            $sig = (Get-Content $sigFile -Raw).Trim()
            $version = $env:TAG.TrimStart("v")
            $manifest = @{
              version = $version
              notes = "Bytwina Browser $env:TAG"
              pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = @{
                "windows-x86_64" = @{
                  signature = $sig
                  url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/$name"
                }
              }
            }
            # nén tối thiểu: client chỉ cần JSON hợp lệ
            $manifest | ConvertTo-Json -Depth 10 -Compress | Set-Content latest.json -Encoding utf8
            Add-Content $env:GITHUB_ENV "UPLOAD_UPDATER=1"
          } else {
            Add-Content $env:GITHUB_ENV "UPLOAD_UPDATER=0"
          }
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @($env:INSTALLER, "SHA256SUMS.txt")
          if ($env:UPLOAD_UPDATER -eq "1") { $files += "latest.json" }
          $notesFile = "docs/CHANGELOG.md"
          $releaseNotes = ""
          if (Test-Path $notesFile) {
            $content = Get-Content $notesFile -Raw -Encoding utf8
            # Trích xuất phần release notes của phiên bản hiện tại
            $pattern = "(?s)## " + [regex]::Escape($env:TAG.TrimStart("v")) + ".*?(?=## \d|\Z)"
            if ($content -match $pattern) {
              $releaseNotes = $matches[0].Trim()
            }
          }
          if ($releaseNotes) {
            $releaseNotes | Out-File -FilePath release_notes.txt -Encoding utf8
            gh release create "$env:TAG" --title "Bytwina Browser $env:TAG" --notes-file release_notes.txt --draft @files
          } else {
            gh release create "$env:TAG" --title "Bytwina Browser $env:TAG" --generate-notes --draft @files
          }
      - name: Verify assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:TAG" --json assets --jq '.assets[].name'
          if ($env:UPLOAD_UPDATER -eq "1") {
            gh release download "$env:TAG" --pattern latest.json --dir verify
            $j = Get-Content verify/latest.json -Raw | ConvertFrom-Json
            if ($j.version -ne $env:TAG.TrimStart("v")) { throw "latest.json sai phiên bản: $($j.version)" }
            Write-Output "latest.json OK: $($j.version), $($j.platforms.'windows-x86_64'.url)"
          }
