name: Benchmarks

# Số đo hiệu năng không chặn bản dựng thường, nên chạy riêng theo lịch và khi bấm tay.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read

jobs:
  probes:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: apps/desktop
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }
      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      # Build release hai lần: bản thường và bản dùng mimalloc, để so sánh bộ cấp phát.
      - name: Micro-probe (allocator mặc định)
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          set +e
          cargo test --release --lib -- --ignored --nocapture --test-threads=1 2>&1 | tee probe-default.txt
          {
            echo '### Micro-probe — allocator mặc định'
            echo '```'
            grep -E 'µs|test result' probe-default.txt || tail -c 20000 probe-default.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit ${PIPESTATUS[0]}
      - name: Micro-probe (mimalloc)
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          set +e
          cargo test --release --features alloc-mimalloc --lib -- --ignored --nocapture --test-threads=1 2>&1 | tee probe-mimalloc.txt
          {
            echo '### Micro-probe — alloc-mimalloc'
            echo '```'
            grep -E 'µs|test result' probe-mimalloc.txt || tail -c 20000 probe-mimalloc.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-logs
          path: apps/desktop/src-tauri/probe-*.txt
          if-no-files-found: warn
