name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      # windows-2025 runner không sẵn Node trong PATH (báo cáo CI M0) → cài tường minh.
      - name: Install Node.js 22
        shell: pwsh
        run: |
          choco install nodejs --version=22.12.0 -y
          echo "C:\Program Files\nodejs" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          node --version
          npm --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci
      - name: Build installer (NSIS)
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis --target x86_64-pc-windows-msvc
      - name: Locate installer
        shell: pwsh
        run: |
          $f = Get-ChildItem -Recurse -Filter *-setup.exe apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis | Select-Object -First 1
          if (-not $f) { throw "NSIS installer not found" }
          echo "INSTALLER=$($f.FullName)" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: bytwina-browser-windows-x64
          path: ${{ env.INSTALLER }}
          if-no-files-found: error
