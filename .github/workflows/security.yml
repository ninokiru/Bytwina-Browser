name: Security

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "**/Cargo.lock"
      - "**/package-lock.json"
      - ".github/workflows/security.yml"

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Cargo audit
        shell: bash
        run: |
          # Chưa commit Cargo.lock thì không có gì để kiểm tra; ghi rõ để không báo xanh giả.
          if [ ! -f Cargo.lock ]; then
            echo "::warning::Thiếu Cargo.lock, bỏ qua cargo audit"
            exit 0
          fi
          set +e
          cargo audit 2>&1 | tee audit.txt
          status=${PIPESTATUS[0]}
          # Bản đầy đủ vào Summary: log của action cần quyền đăng nhập mới đọc được,
          # còn Summary thì xem qua API và ngay trên giao diện.
          {
            echo '### cargo audit'
            echo '```'
            grep -E 'Crate:|Version:|Title:|Date:|URL:|warning:|error:' audit.txt | head -n 160
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E 'Crate:|Title:|URL:' audit.txt | head -n 20 | while IFS= read -r line; do
            # Advisory loại INFO (unmaintained/unsound) chỉ là cảnh báo: gắn
            # ::warning:: để không làm đỏ annotation khi job vẫn xanh.
            if [ "$status" -ne 0 ]; then
              echo "::error::$line"
            else
              echo "::warning::$line"
            fi
          done
          exit "$status"

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit
        run: |
          if [ -f package-lock.json ]; then npm audit --audit-level=high; else echo "::warning::Thiếu package-lock.json, bỏ qua npm audit"; fi
